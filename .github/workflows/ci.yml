name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Zieht Runtime- + Dev-Deps aus uv.lock (inkl. der Git-Libraries
      # textual-themes / textual-widgets, public -> kein Auth noetig).
      - name: Sync dependencies (uv)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run poe lint

      - name: Tests (pytest)
        run: uv run poe test

      # Hinweis: 'poe typecheck' (mypy strict) laeuft hier absichtlich NICHT -
      # die Codebase hat noch eine offene mypy-Baseline. Sobald sie auf 0 ist,
      # als eigenen Step ergaenzen.
