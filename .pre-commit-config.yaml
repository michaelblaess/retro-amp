# Pre-commit hooks - laufen automatisch bei jedem git commit.
# Setup: pre-commit install (einmalig pro Clone)
# Manuell:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1300 KB: laesst die Branding-Assets zu (macOS icon.icns ~526 KB,
        # Gold-Stereo-Renders in assets/ bis ~1,2 MB).
        args: [--maxkb=1300]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Lokaler pytest-Lauf - faengt Regressionen vor dem Commit ab.
  # Suite ist schnell (~0,3 s), laeuft daher bei jedem Commit.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
