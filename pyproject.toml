[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-amp"
version = "0.35.2"
description = "Retro music player for the terminal - MP3, FLAC, OGG, M4A, tracker modules (MOD, S3M) and SID, with lyrics, visualizers and 41 vintage themes"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Michael Blaess" },
]
keywords = ["music", "player", "terminal", "tui", "textual", "chiptune", "sid", "mod", "retro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.6",
    "rich>=13.0",
    "pydantic>=2.0",
    "pygame>=2.5.0",
    "mutagen>=1.47.0",
    "pyogg>=0.6.14a1",
    "miniaudio>=1.61",
    "textual-themes[textual]>=0.15.1",
    "textual-widgets>=0.32.1",
    "textual-image[textual]>=0.12.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "poethepoet>=0.29",
    "ruff>=0.3",
]

[project.scripts]
retro-amp = "retro_amp.__main__:main"

[project.urls]
Homepage = "https://github.com/michaelblaess/retro-amp"
Repository = "https://github.com/michaelblaess/retro-amp"
Issues = "https://github.com/michaelblaess/retro-amp/issues"

[tool.poe.tasks]
run = { cmd = "python -m retro_amp", help = "Startet retro-amp" }
test = { cmd = "pytest", help = "Tests sequentiell (schnell bei Unit-Tests)" }
test-parallel = { cmd = "pytest -n auto", help = "Tests parallel (fuer langsame Test-Suiten)" }
cov = { cmd = "pytest --cov=retro_amp --cov-report=term-missing", help = "Tests + Coverage" }
typecheck = { cmd = "mypy src", help = "mypy strict ueber src/" }
lint = { cmd = "ruff check .", help = "Ruff Linting" }
fmt = { cmd = "ruff format .", help = "Ruff Formatting" }
fix = { cmd = "ruff check --fix .", help = "Ruff Auto-Fix" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retro_amp = ["locale/*.json", "*.tcss"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "textual_widgets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "E402", "N806"]
