[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-amp"
version = "0.24.1"
description = "Terminal-Musikplayer mit Retro-Charme - 31 Vintage-Themes via textual-themes"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.6",
    "rich>=13.0",
    "pydantic>=2.0",
    "pygame>=2.5.0",
    "mutagen>=1.47.0",
    "pyogg>=0.6.14a1",
    "miniaudio>=1.61",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
    "textual-widgets @ git+https://github.com/michaelblaess/textual-widgets.git",
    "textual-image[textual]>=0.12.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "poethepoet>=0.29",
    "ruff>=0.3",
]

[project.scripts]
retro-amp = "retro_amp.__main__:main"

[tool.poe.tasks]
run = { cmd = "python -m retro_amp", help = "Startet retro-amp" }
test = { cmd = "pytest", help = "Tests sequentiell (schnell bei Unit-Tests)" }
test-parallel = { cmd = "pytest -n auto", help = "Tests parallel (fuer langsame Test-Suiten)" }
cov = { cmd = "pytest --cov=retro_amp --cov-report=term-missing", help = "Tests + Coverage" }
typecheck = { cmd = "mypy src", help = "mypy strict ueber src/" }
lint = { cmd = "ruff check .", help = "Ruff Linting" }
fmt = { cmd = "ruff format .", help = "Ruff Formatting" }
fix = { cmd = "ruff check --fix .", help = "Ruff Auto-Fix" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retro_amp = ["locale/*.json"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "E402", "N806"]
